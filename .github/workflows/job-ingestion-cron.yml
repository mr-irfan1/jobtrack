name: JobTrack Periodic Job Ingestion

on:
  # Production Schedule: Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  schedule:
    - cron: '0 */6 * * *'

  # Manual Trigger: Allows on-demand execution from GitHub Actions UI
  workflow_dispatch:
    inputs:
      providers:
        description: 'Comma-separated list of providers to run (remotive, greenhouse, adzuna)'
        required: false
        default: 'remotive,greenhouse,adzuna'
      force:
        description: 'Force execution (bypass active run overlap check)'
        required: false
        type: boolean
        default: false

concurrency:
  group: jobtrack-job-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Execute Periodic Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Ingestion Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.providers }}" ]; then
            ARGS="$ARGS --providers=${{ github.event.inputs.providers }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          node --no-warnings scripts/triggerIngestion.ts $ARGS
