<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /*
       * Pre-paint theme boot: set <html data-theme> before the app renders so
       * the first paint already matches the user's theme (no flash, no
       * transition on load). A stored jobtrack_theme preference wins; otherwise
       * fall back to the OS prefers-color-scheme. The React ThemeProvider takes
       * over from here and owns all subsequent changes. Only reads localStorage;
       * never writes it (system fallback must not pin a preference).
       */
      (function () {
        try {
          var stored = localStorage.getItem('jobtrack_theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>JobTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
